<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07070c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="夜界 — 都市格子戰棋" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>夜界</title>
    <script type="module" crossorigin src="./assets/index-D3lusKWr.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DgY-Y3Hh.css">
  </head>
  <body>
    <div id="app">
      <header id="hud-top">
        <div id="hud-left">
          <div id="hud-title">夜界</div>
          <div id="hud-sub">任務 01　第一手</div>
        </div>
        <div id="hud-right">
          <div id="hud-turn">回合 1</div>
          <div id="hud-phase">我軍</div>
        </div>
      </header>

      <div id="unit-chip" hidden>
        <div id="chip-mark"></div>
        <div id="chip-body">
          <div id="chip-name"></div>
          <div id="chip-meta"></div>
          <div id="chip-hp"><i id="chip-hp-fill"></i></div>
        </div>
      </div>

      <canvas id="board"></canvas>

      <div id="forecast" hidden></div>
      <div id="log"></div>

      <button id="btn-end" type="button" hidden>結束回合</button>

      <nav id="dock">
        <button id="btn-cancel" type="button" disabled>取消</button>
        <button id="btn-wait" type="button" disabled>待機</button>
        <button id="btn-skill" type="button" disabled>技能</button>
        <button id="btn-confirm" type="button" disabled>確認</button>
      </nav>
    </div>

    <section id="briefing">
      <div id="briefing-card">
        <p class="eyebrow">織會內部　密令</p>
        <h1>夜界</h1>
        <h2>任務 01　第一手</h2>
        <p class="loc">西門夜市・北段屋頂</p>
        <div class="rule"></div>
        <p>林澈。舊規把你晾了三年。講者不管舊規。</p>
        <p>
          突擊組已經上屋頂。他們要的不是清場——是把這塊街區納進棋盤。攤商還在收攤。誰看見，誰就得從名冊上消失。
        </p>
        <p>你帶兩個人。目標只有一個：現場指揮官。</p>
        <ul class="conds">
          <li><span>勝利</span>擊倒司夜・賀凜</li>
          <li><span>失敗</span>全隊失去戰鬥能力</li>
        </ul>
        <div class="voices">
          <p><b>林澈</b>「公開統治的第一手，還是夜裡動手。很織會。」</p>
          <p><b>顧晏</b>「樓梯是瓶頸。他們佔高。側翼給你。」</p>
          <p><b>沈芮</b>「我負責把人從水泥上撿回來。別讓我撿三次。」</p>
        </div>
        <button id="btn-start" type="button">進入戰場</button>
      </div>
    </section>

    <section id="result" hidden>
      <div id="result-card">
        <p id="result-kicker"></p>
        <h2 id="result-title"></h2>
        <p id="result-body"></p>
        <button id="btn-restart" type="button">再戰</button>
      </div>
    </section>

  </body>
</html>
